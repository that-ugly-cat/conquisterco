services:
  conquisterco:
    build: .
    image: conquisterco
    restart: always
    # esposto solo su localhost: davanti ci sta Caddy come reverse proxy
    ports:
      - "127.0.0.1:8077:8077"
    volumes:
      # DB (conquisterco.db) e selfie (media/) persistono qui, fuori dall'immagine
      - ./data:/data
    environment:
      # OBBLIGATORIO: secret di sessione, letto da ./.env (gitignored).
      # Senza, le sessioni saltano a ogni restart. Errore chiaro se manca.
      CONQUISTERCO_SECRET: "${CONQUISTERCO_SECRET:?metti CONQUISTERCO_SECRET in .env}"
      # niente auto-seed demo: si usano i dati veri messi in ./data
      CONQUISTERCO_DEMO: "0"
      CONQUISTERCO_DB: /data/conquisterco.db
      CONQUISTERCO_MEDIA: /data/media
      # URL pubblico (per webhook + deep-link Telegram)
      CONQUISTERCO_PUBLIC_URL: "${CONQUISTERCO_PUBLIC_URL:-https://conquisterco.borant.eu}"
      # bot Telegram (token/segreti in .env; vuoti = bot disattivo)
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      TELEGRAM_BOT_USERNAME: "${TELEGRAM_BOT_USERNAME:-conquisterco_bot}"

# Subnet fissata il 19 set 2026. I gateway delle reti Docker finiscono in
# BORANT_TRUSTED_PROXY, e senza un pin dipendono dall'ordine di creazione:
# bastava una risalita in ordine diverso perche' quindici app iniziassero a
# rifiutare le identita' del gate con un 503 che sembra un guasto di auth.
# Le app con repo stanno da 10.200.101.0/24 in su; quelle senza restano non
# fissate nella parte bassa del pool, cosi' non possono rubare uno slot.
networks:
  default:
    ipam:
      config:
        - subnet: 10.200.105.0/24
