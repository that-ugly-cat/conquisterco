<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conquisterco — {{ T.vote_title }}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ static_v }}">
</head>
<body>
  <header>
    <div class="brand">💩 <b>Conquisterco</b> <span class="tag">{{ T.vote_title }}</span></div>
    <div class="auth">
      <span class="lang-sel">
        <a href="/lang/it" class="{{ 'lang-on' if lang == 'it' else '' }}">IT</a>
        <a href="/lang/en" class="{{ 'lang-on' if lang == 'en' else '' }}">EN</a>
      </span>
      <span class="badge-ok">{{ me }}</span>
      <a href="/"><button>{{ T.btn_map }}</button></a>
      <form method="post" action="/logout"><button>{{ T.btn_logout }}</button></form>
    </div>
  </header>

  <div class="prof-wrap">
    <h1>💩 {{ T.vote_title }}</h1>

    {% if not week %}
      <p class="muted">{{ T.vote_closed }}</p>
    {% elif not cands %}
      <p class="muted">{{ T.vote_none }}</p>
    {% else %}
      <p class="muted">{{ T.vote_intro }}
        <span class="nowrap">{{ week.start_ts[:10] }} → {{ week.end_ts[:10] }}</span></p>
      <div class="vote-grid">
        {% for c in cands %}
        <figure class="vcell" data-id="{{ c.id }}">
          <div class="vmedia">
            {% if c.is_video %}
              <video src="/api/selfie/{{ c.id }}#t=0.1" preload="metadata" muted playsinline controls></video>
            {% else %}
              <img loading="lazy" src="/api/selfie/{{ c.id }}" alt="">
            {% endif %}
            <div class="vpoop" role="group" aria-label="{{ T.btn_vote }}">
              {% for n in range(1, max_vote + 1) %}
              <button type="button" class="poop" data-score="{{ n }}"
                      title="{{ n }}/{{ max_vote }}">💩</button>
              {% endfor %}
            </div>
          </div>
          <figcaption>
            <span class="muted">{{ T.vote_of }} {{ c.author }} · {{ c.ts[:10] }}
              {%- if c.comune %} · {{ c.comune }}{% endif %}</span>
            <button type="button" class="undo hidden">↩ {{ T.vote_undo }}</button>
          </figcaption>
        </figure>
        {% endfor %}
      </div>
    {% endif %}
  </div>

  <script>
    // Il voto è ottimistico: si colora subito e si rimette a posto se il server
    // lo rifiuta — con dieci persone che votano dal telefono, aspettare la
    // risposta a ogni cacca rende la pagina legnosa.
    const VOTES = {{ cands | map(attribute='id') | list | tojson }}.reduce((a, id) => (a[id] = null, a), {});
    {% for c in cands %}{% if c.my_vote %}VOTES[{{ c.id }}] = {{ c.my_vote }};{% endif %}{% endfor %}

    function paint(cell) {
      const id = Number(cell.dataset.id), v = VOTES[id];
      cell.querySelectorAll(".poop").forEach(b => {
        b.classList.toggle("on", v !== null && Number(b.dataset.score) <= v);
      });
      cell.classList.toggle("voted", v !== null);
      cell.querySelector(".undo").classList.toggle("hidden", v === null);
    }

    async function post(url, body, cell, previous) {
      const r = await fetch(url, {
        method: "POST", headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: new URLSearchParams(body),
      });
      if (!r.ok) {                       // rifiutato: torna com'era
        VOTES[Number(cell.dataset.id)] = previous;
        paint(cell);
      }
    }

    document.querySelectorAll(".vcell").forEach(cell => {
      const id = Number(cell.dataset.id);
      cell.querySelectorAll(".poop").forEach(btn => {
        btn.addEventListener("click", () => {
          const previous = VOTES[id];
          const score = Number(btn.dataset.score);
          VOTES[id] = score; paint(cell);
          post("/api/vote", {deposit_id: id, score: score}, cell, previous);
        });
      });
      cell.querySelector(".undo").addEventListener("click", () => {
        const previous = VOTES[id];
        VOTES[id] = null; paint(cell);
        post("/api/vote/undo", {deposit_id: id}, cell, previous);
      });
      paint(cell);
    });
  </script>
</body>
</html>
