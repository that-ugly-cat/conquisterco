[project]
name = "conquisterco"
version = "0.1.0"
description = "Il Cacasto — territory-control mondiale a base fecale (motore di dominio)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["tzdata>=2024.1"]
# `tzdata` non e' una libreria ma il database dei fusi orari: `zoneinfo` e'
# stdlib, i suoi dati no. Su Linux li trova in /usr/share/zoneinfo, su Windows
# non esistono e `ZoneInfo("Europe/Rome")` solleva. Il motore ha bisogno del
# fuso di Roma (util.ROME), quindi senza questo pacchetto il progetto gira sul
# VPS e non sulla macchina di Spit.
# Il resto della Fase 1 gira su sola stdlib (sqlite3). Le dipendenze pesanti:
#   geo reale  → shapely, pyproj   (point-in-polygon su poligoni OSM)
#   dashboard  → fastapi, uvicorn, jinja2
#   bot        → python-telegram-bot

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=0.28",   # il TestClient di starlette 1.x lo vuole cosi
    # ...e importa comunque `httpx`. Mancava, e stava nel venv solo di
    # rimbalzo: il 21 set 2026 un `uv sync` pulito l'ha tolto e sedici test
    # delle rotte hanno iniziato a SALTARE invece di fallire, che e' peggio.
    "httpx>=0.28",
]
web = [
    "fastapi==0.139.0",
    "starlette==1.3.1",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "itsdangerous>=2.1",     # SessionMiddleware
    "python-multipart>=0.0.9",  # form login
]

[project.scripts]
conquisterco-demo = "conquisterco.seed:main"
conquisterco-serve = "conquisterco.app.main:serve"
conquisterco-import = "conquisterco.importers.cli:main"
conquisterco-admin = "conquisterco.app.adminctl:main"
conquisterco-recap = "conquisterco.app.recapcli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conquisterco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
